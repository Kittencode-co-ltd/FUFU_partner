<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUFU Partner — Dashboard</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="manifest" href="/manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="h-full bg-slate-50 font-sans">

<!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
<style>
  #sidebar   { transition: transform 0.22s ease; }
  #main-wrap { transition: margin-left 0.22s ease; }

  /* Desktop: toggle collapsed */
  @media (min-width: 768px) {
    body.sb-collapsed #sidebar   { transform: translateX(-100%); }
    body.sb-collapsed #main-wrap { margin-left: 0 !important; }
  }

  /* Mobile: sidebar hidden by default, slides in as overlay */
  @media (max-width: 767px) {
    #sidebar { transform: translateX(-100%); }
    body.sb-open #sidebar { transform: translateX(0); }
    body.sb-open #sb-overlay { display: block !important; }
  }
</style>

<!-- Mobile overlay -->
<div id="sb-overlay" class="hidden fixed inset-0 z-10 bg-black/40 md:hidden"></div>

<aside id="sidebar" class="fixed inset-y-0 left-0 z-20 w-64 bg-navy flex flex-col">

  <!-- Logo -->
  <div class="flex items-center gap-3 px-5 py-5 border-b border-white/10">
    <div class="w-9 h-9 bg-primary rounded-lg flex items-center justify-center shadow-glow flex-shrink-0">
      <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-white">
        <path d="M8.5 3.5a2 2 0 100 4 2 2 0 000-4zm7 0a2 2 0 100 4 2 2 0 000-4zM4 7.5a2 2 0 100 4 2 2 0 000-4zm16 0a2 2 0 100 4 2 2 0 000-4zM12 10c-3.314 0-6 2.686-6 6 0 1.657.672 2.5 2 2.5h8c1.328 0 2-.843 2-2.5 0-3.314-2.686-6-6-6z"/>
      </svg>
    </div>
    <div>
      <div class="text-white font-bold text-base tracking-wider">FUFU</div>
      <div class="text-slate-500 text-xs font-body">Partner Portal</div>
    </div>
  </div>

  <!-- Store info / switcher -->
  <div class="relative border-b border-white/10">
    <button id="sb-store-switcher" type="button"
      class="w-full flex items-center justify-between gap-2 px-5 py-3 text-left hover:bg-white/5 transition-colors">
      <div class="min-w-0">
        <div id="sb-store-name" class="text-white text-sm font-semibold truncate">—</div>
        <div id="sb-store-type" class="text-slate-400 text-xs font-body mt-0.5"></div>
      </div>
      <svg id="sb-store-chevron" class="w-4 h-4 text-slate-400 flex-shrink-0 transition-transform"
           fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>
    <div id="sb-store-dropdown"
         class="hidden absolute left-2 right-2 top-full mt-1 z-30 bg-white rounded-xl shadow-xl
                border border-slate-200 p-1.5 max-h-72 overflow-y-auto"></div>
  </div>



  <!-- Nav -->
  <nav id="sidebar-nav" class="flex-1 overflow-y-auto scrollbar-thin px-3 py-4 space-y-0.5"></nav>

  <!-- User / Logout -->
  <div class="px-4 py-4 border-t border-white/10">
    <div class="flex items-center justify-between gap-2">
      <div class="min-w-0 flex-1">
        <div id="sb-user-email" class="text-slate-300 text-xs font-body truncate"></div>
        <div id="sb-user-role"  class="text-slate-500 text-xs font-body capitalize mt-0.5"></div>
      </div>
      <button id="logout-btn"
        title="ออกจากระบบ"
        class="flex-shrink-0 flex items-center gap-2 text-slate-400 hover:text-white transition-colors px-2 py-1.5 rounded-lg hover:bg-white/10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        <span class="text-xs font-body">ออกจากระบบ</span>
      </button>
    </div>
  </div>
</aside>

<!-- ── Main ──────────────────────────────────────────────────────────────── -->
<div id="main-wrap" class="md:ml-64 flex flex-col min-h-screen">

  <!-- Topbar -->
  <header class="sticky top-0 z-10 bg-white border-b border-slate-100 px-4 h-16 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3 flex-shrink-0">
      <button id="sidebar-toggle" title="ซ่อน/แสดง Sidebar"
        class="p-2 rounded-lg text-slate-400 hover:text-navy hover:bg-slate-100 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <div id="topbar-title" class="font-semibold text-navy text-lg"></div>
    </div>

    <!-- Mode switcher -->
    <!-- <div id="mode-switcher" class="flex items-center gap-1.5 flex-wrap"></div> -->

    <div class="flex items-center gap-3 flex-shrink-0">
      <!-- Offline / sync badge -->
      <div id="offline-badge"
           class="hidden items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full
                  bg-amber-100 text-amber-700 border border-amber-200">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c1.418-1.418 3.103-2.388 4.893-2.914M1.924 8.674c1.854-1.854 4.055-3.2 6.464-3.978m7.78 1.518A14.944 14.944 0 0122.076 8.674M12.53 18.22l-.53.53-.53-.53a.75.75 0 011.06 0z"/>
        </svg>
        <span>ออฟไลน์</span>
        <span id="sync-count"
              class="hidden items-center justify-center w-4 h-4 rounded-full
                     bg-amber-500 text-white text-xs leading-none"></span>
      </div>
      <div id="save-indicator" class="text-xs text-slate-400 font-body hidden"></div>
      <div id="topbar-date"    class="text-slate-400 text-sm font-body hidden lg:block"></div>
    </div>
  </header>

  <!-- Pages -->
  <main class="flex-1 p-3 sm:p-5 md:p-6">
    <section id="page-home"      class="hidden"></section>
    <section id="page-appointments" class="hidden"></section>
    <section id="page-calendar"     class="hidden"></section>
    <section id="page-patients"     class="hidden"></section>
    <section id="page-summaries"    class="hidden"></section>
    <section id="page-clinic"       class="hidden"></section>
    <section id="page-users"        class="hidden"></section>
    <section id="page-queue"     class="hidden"></section>
    <section id="page-opd"       class="hidden" style="margin:-12px;overflow:hidden;"><div id="doctor-workroom-root"></div></section>
    <section id="page-pets"         class="hidden"></section>
    <section id="page-pet-profile"  class="hidden"></section>
    <section id="page-medical"      class="hidden"></section>
    <section id="page-income"    class="hidden"></section>
    <section id="page-inventory" class="hidden"></section>
    <section id="page-pos"      class="hidden"></section>
    <section id="page-hotel"    class="hidden"></section>
    <section id="page-grooming" class="hidden"></section>
    <section id="page-ipd"       class="hidden"></section>
    <section id="page-documents" class="hidden"></section>
    <section id="page-kanban"    class="hidden"></section>
    <section id="page-staff"    class="hidden"></section>
    <section id="page-settings" class="hidden"></section>
  </main>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
