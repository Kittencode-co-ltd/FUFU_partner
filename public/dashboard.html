<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F5F9F8">
  <script src="/js/theme-init.js"></script>
  <title>FUFU Partner — Dashboard</title>
  <link rel="icon" href="/img/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="/img/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="manifest" href="/manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="h-full app-bg font-sans">

<!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
<!-- Layout breakpoints: <1024px = drawer sidebar (tablet + mobile), <768px = + bottom tab bar.
     Styles live in src/css/input.css (#sidebar, #sb-overlay, #bottom-nav, .sb-*). -->

<!-- Drawer overlay (tablet / mobile) -->
<div id="sb-overlay" class="fixed inset-0 z-30 lg:hidden" aria-hidden="true"></div>

<aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 lg:w-64 flex flex-col" aria-label="เมนูหลัก">

  <!-- Logo -->
  <div class="sb-brand">
    <img src="/img/brand/fufu-mark.webp" alt="" width="36" height="36">
    <div class="min-w-0">
      <div class="sb-brand__name">FUFU <em>Pet Care</em></div>
      <div class="sb-brand__sub">Partner Portal</div>
    </div>
  </div>

  <!-- Store info / switcher -->
  <div class="relative px-3 pb-2">
    <button id="sb-store-switcher" type="button" class="sb-store">
      <div class="min-w-0 flex-1">
        <div id="sb-store-name" class="sb-store__name truncate">—</div>
        <div id="sb-store-type" class="sb-store__type"></div>
      </div>
      <svg id="sb-store-chevron" class="w-4 h-4 flex-shrink-0 transition-transform"
           fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>
    <div id="sb-store-dropdown" class="sb-dropdown hidden"></div>
  </div>

  <!-- Nav -->
  <nav id="sidebar-nav" class="flex-1 overflow-y-auto scrollbar-thin px-3 py-2 space-y-0.5"></nav>

</aside>

<!-- ── Main ──────────────────────────────────────────────────────────────── -->
<div id="main-wrap" class="lg:ml-64 flex flex-col min-h-screen min-w-0">

  <!-- Topbar -->
  <header id="topbar" class="sticky top-0 z-20 px-3 sm:px-5 h-14 sm:h-16 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2 sm:gap-3 min-w-0">
      <button id="sidebar-toggle" title="ซ่อน/แสดง Sidebar" aria-label="เปิด/ปิดเมนู" aria-controls="sidebar" aria-expanded="false"
        class="icon-btn">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h10"/>
        </svg>
      </button>
      <div id="topbar-title" class="topbar-title truncate"></div>
    </div>

    <!-- Mode switcher -->
    <!-- <div id="mode-switcher" class="flex items-center gap-1.5 flex-wrap"></div> -->

    <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
      <!-- Offline / sync badge -->
      <div id="offline-badge"
           class="hidden items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full
                  bg-amber-100 text-amber-700 border border-amber-200">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c1.418-1.418 3.103-2.388 4.893-2.914M1.924 8.674c1.854-1.854 4.055-3.2 6.464-3.978m7.78 1.518A14.944 14.944 0 0122.076 8.674M12.53 18.22l-.53.53-.53-.53a.75.75 0 011.06 0z"/>
        </svg>
        <span>ออฟไลน์</span>
        <span id="sync-count"
              class="hidden items-center justify-center w-4 h-4 rounded-full
                     bg-amber-500 text-white text-xs leading-none"></span>
      </div>
      <div id="save-indicator" class="text-xs text-slate-400 font-body hidden"></div>
      <div id="topbar-date" class="topbar-date hidden lg:block"></div>
      <button type="button" id="profile-btn" class="profile-btn" aria-haspopup="dialog" aria-expanded="false" aria-label="บัญชีของฉัน">
        <span data-profile-initial>?</span>
      </button>
    </div>
  </header>

  <!-- Pages -->
  <main id="app-main" class="flex-1 min-w-0 p-3 sm:p-5 lg:p-6 xl:p-8 pb-24 md:pb-6 w-full max-w-[1600px] mx-auto">
    <nav id="flow-steps" class="flow-steps" aria-label="ขั้นตอนการให้บริการ" hidden></nav>
    <section id="page-home"      class="hidden"></section>
    <section id="page-screenings" class="hidden"></section>
    <section id="page-appointments" class="hidden"></section>
    <section id="page-calendar"     class="hidden"></section>
    <section id="page-patients"     class="hidden"></section>
    <section id="page-summaries"    class="hidden"></section>
    <section id="page-clinic"       class="hidden"></section>
    <section id="page-users"        class="hidden"></section>
    <section id="page-queue"     class="hidden"></section>
    <section id="page-cashier"   class="hidden"></section>
    <section id="page-opd"       class="hidden" style="margin:-12px;overflow:hidden;"><div id="doctor-workroom-root"></div></section>
    <section id="page-pets"         class="hidden"></section>
    <section id="page-pet-profile"  class="hidden"></section>
    <section id="page-medical"      class="hidden"></section>
    <section id="page-income"    class="hidden"></section>
    <section id="page-orders"    class="hidden"></section>
    <section id="page-delivery"  class="hidden"></section>
    <section id="page-inventory" class="hidden"></section>
    <section id="page-pos"      class="hidden"></section>
    <section id="page-hotel"    class="hidden"></section>
    <section id="page-grooming" class="hidden"></section>
    <section id="page-ipd"       class="hidden"></section>
    <section id="page-documents" class="hidden"></section>
    <section id="page-kanban"    class="hidden"></section>
    <section id="page-staff"    class="hidden"></section>
    <section id="page-settings" class="hidden"></section>
  </main>
</div>

<!-- Bottom tab bar (mobile < 768px) — items are built by dashboard.js from the active nav -->
<nav id="bottom-nav" class="md:hidden" aria-label="เมนูลัด"></nav>

<script type="module" src="/js/app.js"></script>
</body>
</html>
