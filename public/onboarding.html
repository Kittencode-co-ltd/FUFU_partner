<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUFU Partner — สร้างร้านค้าแรกของคุณ</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/img/brand/favicon-64.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen app-bg font-sans flex flex-col items-center justify-center px-4 py-12">

  <!-- Logo -->
  <div class="flex items-center gap-3 mb-10">
    <img src="/img/brand/fufu-mark.webp" alt="" width="48" height="48" class="w-12 h-12 rounded-2xl shadow-glow">
    <div class="font-brand text-xl leading-none"><span class="text-brand">FUFU</span> <span class="text-accent">Pet Care</span></div>
  </div>

  <div class="w-full max-w-md card p-6 sm:p-8 animate-scale-in">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-primary-subtle rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">🏪</div>
      <h2 class="text-2xl font-bold text-navy">สร้างร้านค้าแรก</h2>
      <p class="text-slate-500 text-sm font-body mt-2">
        บัญชีของคุณพร้อมแล้ว — เพิ่มร้านค้าเพื่อเริ่มใช้งาน Partner Portal
      </p>
    </div>

    <!-- Info: why are they here? -->
    <div class="mb-6 p-3 bg-blue-50 border border-blue-100 rounded-xl text-xs text-blue-700 font-body">
      💡 หากคุณเคยใช้ FUFU App มาก่อน บัญชีนี้จะเชื่อมกันโดยอัตโนมัติ — ลูกค้าที่จองผ่าน App จะปรากฏในระบบของคุณทันที
    </div>

    <!-- Create store form -->
    <div id="onboarding-store"></div>

  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
