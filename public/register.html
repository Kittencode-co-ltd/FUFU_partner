<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUFU Partner — สมัครเป็น Partner</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="manifest" href="/manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50 font-sans flex flex-col items-center justify-center px-4 py-12">

  <!-- Logo -->
  <div class="flex items-center gap-3 mb-8">
    <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-lg shadow-glow">🐾</div>
    <div class="font-bold text-navy text-lg">FUFU Partner</div>
  </div>

  <div class="w-full max-w-md card p-8">
    <h2 class="text-2xl font-bold text-navy mb-1">สมัครเป็น Partner</h2>
    <p class="text-slate-500 text-sm font-body mb-8">
      กรอกข้อมูลธุรกิจเพื่อยื่นคำขอเข้าร่วม FUFU Partner
    </p>

    <form id="register-form" novalidate class="space-y-4">

      <!-- Name -->
      <div>
        <label class="input-label" for="name">ชื่อ-นามสกุล (เจ้าของ)</label>
        <input id="name" name="name" type="text"
          class="input-field" placeholder="สมชาย วิชัยดิษฐ" required>
      </div>

      <!-- Email -->
      <div>
        <label class="input-label" for="reg-email">อีเมล</label>
        <input id="reg-email" name="email" type="email"
          class="input-field" placeholder="you@example.com" required>
      </div>

      <!-- Phone -->
      <div>
        <label class="input-label" for="phone">เบอร์โทรศัพท์</label>
        <input id="phone" name="phone" type="tel"
          class="input-field" placeholder="081-234-5678">
      </div>

      <!-- Business type -->
      <div>
        <label class="input-label" for="partnerType">ประเภทธุรกิจ</label>
        <select id="partnerType" name="partnerType" class="input-field cursor-pointer">
          <option value="vet_clinic">🏥 คลินิกสัตว์แพทย์</option>
          <option value="pet_shop">🛍 ร้านค้าสัตว์เลี้ยง (Pet Shop)</option>
          <option value="pet_hotel">🏨 โรงแรมสัตว์เลี้ยง</option>
          <option value="pet_grooming">✂️ บริการอาบน้ำตัดขน</option>
        </select>
      </div>

      <!-- Password -->
      <div>
        <label class="input-label" for="reg-password">รหัสผ่าน (อย่างน้อย 8 ตัว)</label>
        <input id="reg-password" name="password" type="password"
          class="input-field" placeholder="••••••••" minlength="8" required>
      </div>

      <button type="submit"
        class="btn-primary w-full mt-2">
        ส่งคำขอสมัคร
      </button>
    </form>

    <p class="text-center text-sm text-slate-500 font-body mt-6">
      มีบัญชีแล้ว?
      <a href="/login.html" class="text-primary font-semibold hover:underline ml-1">เข้าสู่ระบบ</a>
    </p>
  </div>

  <p class="text-slate-400 text-xs font-body mt-6 text-center">
    เมื่อส่งฟอร์ม ทีมงาน FUFU จะตรวจสอบและส่งข้อมูลเข้าใช้งานภายใน 1-2 วันทำการ
  </p>

<script type="module" src="/js/app.js"></script>
</body>
</html>
