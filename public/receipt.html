<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>ใบเสร็จรับเงิน</title>
  <link rel="icon" href="/img/brand/favicon-64.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/receipt.css">
</head>
<body>
  <!-- Toolbar (screen only) -->
  <header class="rc-bar" id="rc-bar">
    <div class="rc-bar__group" role="radiogroup" aria-label="รูปแบบเอกสาร">
      <button type="button" data-format="slip" role="radio">ใบเสร็จ 80 มม.</button>
      <button type="button" data-format="a4" role="radio">A4</button>
    </div>
    <label class="rc-check" id="rc-full-wrap" hidden>
      <input type="checkbox" id="rc-full"> ใบกำกับภาษีเต็มรูป
    </label>
    <div class="rc-bar__spacer"></div>
    <button type="button" class="rc-btn" data-action="pdf">บันทึก PDF</button>
    <button type="button" class="rc-btn is-primary" data-action="print">พิมพ์</button>
  </header>

  <!-- Buyer details for a full tax invoice (screen only) -->
  <form class="rc-buyer" id="rc-buyer" hidden>
    <p class="rc-buyer__title">ข้อมูลผู้ซื้อ (สำหรับใบกำกับภาษีเต็มรูป)</p>
    <label>ชื่อผู้ซื้อ / บริษัท<input name="name" maxlength="200" required></label>
    <label>ที่อยู่<input name="address" maxlength="400"></label>
    <div class="rc-buyer__row">
      <label>เลขประจำตัวผู้เสียภาษี<input name="tax_id" inputmode="numeric" maxlength="13" pattern="[0-9]{13}" placeholder="13 หลัก"></label>
      <label>สำนักงานใหญ่ / สาขา<input name="branch" maxlength="60" placeholder="สำนักงานใหญ่"></label>
    </div>
    <button type="submit" class="rc-btn">บันทึกข้อมูลผู้ซื้อ</button>
    <p class="rc-buyer__note">เมื่อออกใบกำกับภาษีเต็มรูปแล้ว จะแก้ข้อมูลผู้ซื้อไม่ได้</p>
  </form>

  <p class="rc-msg" id="rc-msg" role="status" hidden></p>
  <main id="rc-doc" class="rc-doc" aria-live="polite"><p class="rc-loading">กำลังโหลดเอกสาร…</p></main>

  <script type="module" src="/js/partner/receipt-page.js"></script>
</body>
</html>
