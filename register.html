<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUFU – สมัครสมาชิก</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/register.css">
</head>

<body class="register-page">

  <div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
  </div>

  <div class="register-wrapper">
    <div class="register-card">
      <div class="logo-header">
        <div class="logo-icon">🐾</div>
        <div class="card-title">สร้างบัญชีผู้ใช้ใหม่</div>
        <div class="card-sub">เข้าร่วมเป็นส่วนหนึ่งของระบบ FUFU</div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tab-user">ผู้ใช้งานทั่วไป</button>
        <button class="tab-btn" id="tab-partner">พาร์ทเนอร์ธุรกิจ</button>
      </div>

      <!-- Common Fields -->
      <div class="form-group">
        <label class="form-label">ชื่อ - นามสกุล / ชื่อร้าน</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" class="form-input" id="name" placeholder="ชื่อของคุณ หรือ ร้านค้า">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">อีเมล</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input type="email" class="form-input" id="email" placeholder="example@fufu.app">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">รหัสผ่าน</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" class="form-input" id="password" placeholder="อย่างน้อย 6 ตัวอักษร">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">เบอร์โทรศัพท์</label>
        <div class="input-wrap">
          <i class="fas fa-phone"></i>
          <input type="tel" class="form-input" id="phone" placeholder="08x-xxx-xxxx">
        </div>
      </div>

      <!-- Partner specific fields -->
      <div class="partner-fields" id="partner-fields">
        <div class="form-group">
          <label class="form-label">ประเภทพาร์ทเนอร์</label>
          <div class="input-wrap">
            <i class="fas fa-store"></i>
            <select class="form-select" id="partner-type">
              <option value="vet">คลินิกรักษาสัตว์ (Vet Clinic)</option>
              <option value="shop">ร้านค้าขายสินค้า (Pet Shop)</option>
              <option value="service">บริการอื่นๆ (Pet Service / Grooming)</option>
            </select>
          </div>
        </div>
      </div>

      <button class="submit-btn" id="submit-btn">
        <span id="btn-text">ลงทะเบียน</span>
        <div class="spinner" id="spinner"></div>
      </button>

      <a href="login.html" class="switch-link">มีบัญชีผู้ใช้งานแล้วใช่ไหม? <span>เข้าสู่ระบบ</span></a>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>

</body>

</html>
